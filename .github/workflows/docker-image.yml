name: Publish Docker image (AMD64 only)

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build_amd64:
    name: Build & push (amd64)
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine image tags
        id: tags
        run: |
          # Normalize repository name to lowercase
          GHCR_REPO="${GITHUB_REPOSITORY,,}"
          echo "GHCR_REPO=$GHCR_REPO" >> $GITHUB_ENV

          SHORT_SHA="$(git rev-parse --short=12 HEAD)"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Tag push: use tag name (lowercase)
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG,,}"
            {
              echo "TAGS<<EOF"
              echo "ghcr.io/${GHCR_REPO}:${VERSION}"
              echo "ghcr.io/${GHCR_REPO}:sha-${SHORT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
            echo "Building tag: $TAG -> $VERSION"

          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            # Main branch/manual dispatch: publish the deployment tag and latest.
            VERSION="zhongruan0522"
            {
              echo "TAGS<<EOF"
              echo "ghcr.io/${GHCR_REPO}:zhongruan0522"
              echo "ghcr.io/${GHCR_REPO}:latest"
              echo "ghcr.io/${GHCR_REPO}:sha-${SHORT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "VERSION=zhongruan0522" >> "$GITHUB_ENV"
            echo "Building main branch -> zhongruan0522/latest/sha-${SHORT_SHA}"

          else
            echo "Unknown ref: ${{ github.ref }}"
            exit 1
          fi

          # Write VERSION file for build
          echo "$VERSION" > VERSION

          # Write COMMIT file for build (git commit hash injected into Version variable)
          git rev-parse HEAD > COMMIT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.GHCR_REPO }}

      - name: Build & push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.TAGS }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
